<!DOCTYPE html>
<html>
<style>
    :root {
        --falu-red: #721817ff;
        --sandy-brown: #fa9f42ff;
        --indigo-dye: #2b4162ff;
        --dartmouth-green: #0b6e4fff;
        --platinum: #e0e0e2ff;

        --k-background1: var(--platinum);
        --k-background2: var(--sandy-brown);

        --k-min-section-height: 450px;
        --k-triangle-size: 32px;
        --k-triangle-border-size: 35px;

        --k-border-1-grad: linear-gradient(90deg,
                                           rgba(42, 123, 155, 1) 0%,
                                           rgba(87, 199, 133, 1) 50%,
                                           rgba(237, 221, 83, 1) 100%);
    }

    html {
        font-family: sans-serif;
    }

    body {
        margin: 0px;
    }

    .animate.pop {
      animation-duration: 0.5s;
      animation-name: animate-pop;
      animation-timing-function: cubic-bezier(.26, .53, .74, 1.48);
    }

    @keyframes animate-pop {
        0% {
            opacity: 0;
            transform: scale(0.5, 0.5);
        }

        100% {
            opacity: 1;
            transform: scale(1, 1);
        }
    }

    .delay-1 { animation-delay: 0.6s; }  
    .delay-2 { animation-delay: 0.7s; }
    .delay-3 { animation-delay: 0.8s; }

    @media screen and (prefers-reduced-motion: reduce) {
        .animate { animation: none !important; }
    }

    .msec {
        display: flex;
        min-height: var(--k-min-section-height);
        /*justify-content: center;*/
        align-items: center;
        flex-direction: column;
        position: relative;
    }

    .msec-bg1 {
        background-color: var(--k-background1);
    }

    .msec-border1 {
        position: absolute;
        bottom: -2px;
        right: 0px;
        height: 2px;
        width: 100%;
        box-shadow: 0px 0 20px 0 black;
        /*transition: background-position 0.02s ease-in;*/
    }

    .msec-border2 {
        position: absolute;
        top: -2px;
        right: 0px;
        height: 2px;
        width: 100%;
        box-shadow: inset 20px  black;
        /*transition: background-position 0.02s ease-in;*/
    }

    .msec-bg2 {
        background-color: var(--k-background2);
    }

    .msec-content {
        margin: 0px 8px 8px 24px;
    }

    .left-triangle {
        position: absolute;
        width: 0px;
        height: 0px;
        top: 0%;
        left: 0%;
        border-style: solid;
        border-width: var(--k-triangle-size) var(--k-triangle-size) 0 0;
        border-color: var(--k-background2) transparent transparent transparent ;
        transform: rotate(0deg);
    }

    .right-triangle {
        position: absolute;
        box-shadow: 10px 10px 0px 0px black;
        width: 0px;
        height: 0px;
        bottom: 0%;
        right: 0%;
        border-style: solid;
        border-width: 0 0 var(--k-triangle-size) var(--k-triangle-size);
        border-color: transparent transparent var(--k-background2) transparent;
        /*border-color: transparent transparent red transparent;*/
        transform: rotate(0deg);
    }

    #csec {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    #profile {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background-color: grey;
    }

    #landing {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-top: 100px;
        padding-bottom: 300px;
        background-color: rgba(50, 50, 50, 1.0);
    }

    .navbutton {
        background-color: transparent;
        color: white;
        font-size: 1em;
        border: 0px solid transparent;
        border-radius: 10%;
    }

    .navbutton:hover {
        background-color: red;
    }

    #menu {
        position: fixed;
        z-index: 100;
        width: 100%;
        background-color: #2b4162aa;
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: row;
        justify-content: center;
        min-height: 40px;

        transition: background-color 0.2s ease-in;
    }

    #menu:hover {
        background-color: #2b4162ff;
    }
</style>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michael Dodis</title>
</head>
<body>
    <nav id="menu">
        <button class="navbutton">Home</button>
        <button class="navbutton">About</button>
        <button class="navbutton">Work</button>
        <button class="navbutton">Projects</button>
    </nav>
            
    <div id="csec">

        <!-- 
            Landing Section
        -->
        <div id="landing">
            <div id="profile">
               
            </div> 
        </div>


        <div class="msec msec-bg1" id="about">
            <div class="msec-border1"></div>
            <div class="right-triangle"></div>

            <div class="msec-content">
                <p>
                   Hi there! I'm Michael Dodis, a <b>Software Engineer</b> situated in Geneva, Switzerland
               </p>
            </div>
        </div>

        <!-- 
            2nd Section
        -->
        <div class="msec msec-bg2" id="work">
            <div class="msec-content">
               <p>
                   Hi there! I'm Michael Dodis, a <b>Software Engineer</b> situated in Geneva, Switzerland
               </p>
            </div>
        </div>

        <!-- 
            3rd Section
        -->
        <div class="msec msec-bg1" id="projects">
            <div class="msec-border2"></div>
            <div class="left-triangle"></div>
            <div class="msec-content">
               <p>
                   Hi there! I'm Michael Dodis, a <b>Software Engineer</b> situated in Geneva, Switzerland
               </p>
            </div>
        </div>

    </div>
</body>

</script>
</html>
